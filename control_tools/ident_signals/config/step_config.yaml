step_generator_node:
  ros__parameters:
    is_float32: false
    use_sim_time: true
    signal_frequency: 0.1
    signal_amplitude: 30.0
    signal_sequences: 2
    left_step_vector: [1.0, -1.0, 0.0]
    right_step_vector: [1.0, -1.0, 0.0]
    left_joint_cmd_topic: "/left_wheel_joint_effort_controller/commands"
    right_joint_cmd_topic: "/right_wheel_joint_effort_controller/commands"